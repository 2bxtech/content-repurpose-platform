# Installed by `make install` (pre-commit install). Run on everything: `pre-commit run -a`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0  # keep in step with ruff in backend/requirements-dev.txt
    hooks:
      - id: ruff-check

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3  # same version CI uses
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-yaml
