# Local development stack.
#   docker compose up -d            -> postgres, redis, api (runs migrations on start), worker, beat
#   docker compose --profile tools up -d   -> also pgAdmin and Redis Commander
#
# Values are read from .env when present; defaults work without one.
# With no AI key set, the API uses the built-in mock provider (development only).

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres_dev_password}@postgres:5432/${DATABASE_NAME:-content_repurpose}
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: development
  DEBUG: "true"
  SECRET_KEY: ${SECRET_KEY:-local-dev-access-token-signing-key-not-for-prod}
  REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY:-local-dev-refresh-token-signing-key-not-for-prod}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  AI_PROVIDER: ${AI_PROVIDER:-anthropic}
  CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
  # Integration tests register many users quickly; CI raises these limits.
  RATE_LIMIT_AUTH_ATTEMPTS: ${RATE_LIMIT_AUTH_ATTEMPTS:-5/15m}
  RATE_LIMIT_API_CALLS: ${RATE_LIMIT_API_CALLS:-100/1m}
  RATE_LIMIT_TRANSFORMATIONS: ${RATE_LIMIT_TRANSFORMATIONS:-30/1h}

x-app: &app
  build: .
  restart: unless-stopped
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-content_repurpose}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres_dev_password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    ports:
      - "${API_HOST_PORT:-8000}:8000"

  worker:
    <<: *app
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true

  beat:
    <<: *app
    command: celery -A app.core.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev_password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on: [postgres]

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: [tools]
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on: [redis]

volumes:
  postgres_data:
  redis_data:
